site_name: GRAIN - Documentation
site_description: Global Registry of Agricultural Irrigation Networks
repo_url: https://github.com/UW-SASWE/GRAIN
theme:
  name: material
  custom_dir: overrides
  logo: images/uw_logo_white.png
  favicon: images/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  # Light mode only; the accent (hover) color is UW purple, set in stylesheets/extra.css
  palette:
    scheme: default
    primary: blue
    accent: custom
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    # - navigation.footer


extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - GRAIN Visualizer: https://uw-saswe.github.io/GRAIN-Visualizer/
  - Methodology and Datasets Used: grain_methodology.md
  - Reproducing GRAIN Workflow: reproduce_workflow.md
  - Data Structure and Schema: attribute_schema.md
  - Reading GRAIN Data: reading_grain.md
  - Disclaimer: disclaimer.md
  # - Data Sources: data_sources.md
  # - Model: model.md
  # - Validation: validation.md
  # - Examples: examples.md
plugins:
  - search
  # Optional (nice for notebooks):
  - mkdocs-jupyter
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets  
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.keys
  - toc:
      permalink: true

extra:
  analytics:
    provider: google
    property: G-TVNFWF3VZ0
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SarathUW
      name: GitHub

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/sarathsuresh96/
      name: LinkedIn
copyright: 'Written and maintained by <a href="https://www.linkedin.com/in/sarathsuresh96/" target="_blank"><b>Sarath Suresh</b>, </a> SASWE Labs, University of Washington'
